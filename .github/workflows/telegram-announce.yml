# Posts viewer news to the EUC Viewer Telegram channel through the same
# bot the eucplanet CI uses. Two ways to publish:
#
#   1. Manual: Actions -> "Telegram announce" -> Run workflow, type the
#      message (or run: gh workflow run telegram-announce.yml -f message="...").
#   2. Per commit: include a line starting with "announce:" in the commit
#      message; everything after the colon is posted. Ordinary pushes
#      stay silent.
#
# Opt-in via repo secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN  - same bot token as eucplanet
#   TELEGRAM_CHANNEL_ID - "@ChannelName" (public) or "-100..." (private);
#                         the bot must be a channel admin that can post.
# Missing secrets skip the post; a Telegram hiccup never fails the run.
name: Telegram announce

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Announcement text (plain text; the viewer link is appended)"
        required: true
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to the channel
        # Inputs and the commit message reach the shell via env, never
        # inlined into the script, to avoid expression injection.
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISPATCH_MSG: ${{ inputs.message }}
          COMMIT_MSG: ${{ github.event_name == 'push' && github.event.head_commit.message || '' }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::notice::Telegram secrets not set; skipping."; exit 0
          fi
          if [ -n "$DISPATCH_MSG" ]; then
            msg="$DISPATCH_MSG"
          else
            # Push trigger: only commits that carry an "announce:" line post.
            msg=$(printf '%s\n' "$COMMIT_MSG" | sed -n 's/^announce:[[:space:]]*//p' | head -n 1)
            if [ -z "$msg" ]; then
              echo "No announce: line in the commit message; staying quiet."; exit 0
            fi
          fi
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text="$(esc "$msg")

          🌍 https://eucviewer.ried.no"
          curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "parse_mode=HTML" -d "disable_web_page_preview=true" \
            -o /dev/null -w "Telegram HTTP %{http_code}\n" || true
